<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradiente Neón Anime -->
    <linearGradient id="animeTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0" />
      <stop offset="50%" stop-color="#7209b7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="1" />
    </linearGradient>

    <!-- Glow sutil -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Animación de Giro CSS -->
    <style>
      @keyframes spinBall {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .ball-spin {
        transform-origin: 65px 35px;
        animation: spinBall 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- LÍNEAS DE VELOCIDAD / ESTELA ANIME -->
  <path d="M 8 82 C 18 72, 32 67, 48 62" stroke="url(#animeTrail)" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  <path d="M 4 58 C 24 48, 42 38, 62 28" stroke="url(#animeTrail)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 22 92 C 42 77, 58 57, 72 32" stroke="url(#animeTrail)" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- BALÓN EN EL AIRE (GIRO CONTINUO) -->
  <g class="ball-spin" filter="url(#neonGlow)">
    <circle cx="65" cy="35" r="22" stroke="#00f2fe" stroke-width="3.5" fill="#0f172a" />
    <polygon points="65,23 74,29 70,39 60,39 56,29" fill="#00f2fe" opacity="0.95" />
    <line x1="65" y1="23" x2="65" y2="13" stroke="#00f2fe" stroke-width="2.5" />
    <line x1="74" y1="29" x2="84" y2="26" stroke="#00f2fe" stroke-width="2.5" />
    <line x1="70" y1="39" x2="78" y2="47" stroke="#00f2fe" stroke-width="2.5" />
    <line x1="60" y1="39" x2="52" y2="47" stroke="#00f2fe" stroke-width="2.5" />
    <line x1="56" y1="29" x2="46" y2="26" stroke="#00f2fe" stroke-width="2.5" />
  </g>
</svg>
